services:
  backend-b:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: boostad-backend-b-local
    command: node dist/main.js
    ports:
      - '3001:3000'
    environment:
      PORT: '3000'
      NODE_ENV: ${NODE_ENV:-development}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      CLIENT_URL: ${CLIENT_URL:-https://localhost:5173}
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_USERNAME: ${DB_USERNAME:-test_user}
      DB_PASSWORD: ${DB_PASSWORD:-test_user}
      DB_DATABASE: ${DB_DATABASE:-test_db}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      NCP_ACCESS_KEY: ${NCP_ACCESS_KEY:-}
      NCP_SECRET_KEY: ${NCP_SECRET_KEY:-}
      NCP_REGION: ${NCP_REGION:-kr-standard}
      NCP_ENDPOINT: ${NCP_ENDPOINT:-https://kr.object.ncloudstorage.com}
      NCP_BUCKET: ${NCP_BUCKET:-boostadad-campaign-images}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      RTB_ENABLE_ALL_LOGS: ${RTB_ENABLE_ALL_LOGS:-false}
      LOADTEST_RESET_ENABLED: ${LOADTEST_RESET_ENABLED:-true}
      LOADTEST_RESET_TOKEN: ${LOADTEST_RESET_TOKEN:-boostad-loadtest-reset-local}
      RTB_MATCHER_ANN_ENABLED: ${RTB_MATCHER_ANN_ENABLED:-true}
      RTB_MATCHER_ANN_TOP_L: ${RTB_MATCHER_ANN_TOP_L:-64}
      RTB_MATCHER_ANN_TOP_M: ${RTB_MATCHER_ANN_TOP_M:-20}
      RTB_MATCHER_ANN_PER_CAMPAIGN_HIT_LIMIT: ${RTB_MATCHER_ANN_PER_CAMPAIGN_HIT_LIMIT:-2}
      RTB_CAMPAIGN_SOURCE: ${RTB_CAMPAIGN_SOURCE:-local_snapshot}
      RTB_BUDGET_MODE: ${RTB_BUDGET_MODE:-winner_only}
      RTB_EMBEDDING_L2_ENABLED: ${RTB_EMBEDDING_L2_ENABLED:-true}
      RTB_EMBEDDING_L2_LOOKUP_BUDGET_MS: ${RTB_EMBEDDING_L2_LOOKUP_BUDGET_MS:-5}
      RTB_EMBEDDING_L2_WRITE_BUDGET_MS: ${RTB_EMBEDDING_L2_WRITE_BUDGET_MS:-5}
      RTB_EMBEDDING_L2_TTL_SECONDS: ${RTB_EMBEDDING_L2_TTL_SECONDS:-604800}
      RTB_EMBEDDING_L1_MAX_SIZE: ${RTB_EMBEDDING_L1_MAX_SIZE:-1000}
      RTB_EMBEDDING_COLD_MISS_FAST_PATH_ENABLED: ${RTB_EMBEDDING_COLD_MISS_FAST_PATH_ENABLED:-true}
      RTB_LEXICAL_TOP_M: ${RTB_LEXICAL_TOP_M:-30}
      RTB_EMBEDDING_BACKGROUND_MAX_CONCURRENCY: ${RTB_EMBEDDING_BACKGROUND_MAX_CONCURRENCY:-1}
      RTB_EMBEDDING_BACKGROUND_MAX_QUEUE_SIZE: ${RTB_EMBEDDING_BACKGROUND_MAX_QUEUE_SIZE:-100}
      RTB_CONTEXT_MAX_BODY_CHARS: ${RTB_CONTEXT_MAX_BODY_CHARS:-8000}
      RTB_CONTEXT_READY_TTL_SECONDS: ${RTB_CONTEXT_READY_TTL_SECONDS:-604800}
      RTB_CONTEXT_PENDING_TTL_SECONDS: ${RTB_CONTEXT_PENDING_TTL_SECONDS:-600}
      RTB_CONTEXT_JOB_LOCK_TTL_SECONDS: ${RTB_CONTEXT_JOB_LOCK_TTL_SECONDS:-600}
      RTB_CONTEXT_LOOKUP_BUDGET_MS: ${RTB_CONTEXT_LOOKUP_BUDGET_MS:-5}
      RTB_CONTEXT_DECISION_ENABLED: ${RTB_CONTEXT_DECISION_ENABLED:-true}
      RTB_CONTEXT_L1_MAX_SIZE: ${RTB_CONTEXT_L1_MAX_SIZE:-1000}
      RTB_CONTEXT_L1_TTL_MS: ${RTB_CONTEXT_L1_TTL_MS:-300000}
    depends_on:
      - mysql
      - redis
    networks:
      - boostad-local
    restart: unless-stopped
    cpus: ${BACKEND_B_CPUS:-2.0}
    mem_limit: ${BACKEND_B_MEM_LIMIT:-4g}
    pids_limit: ${BACKEND_B_PIDS_LIMIT:-256}
